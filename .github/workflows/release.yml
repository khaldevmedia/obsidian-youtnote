name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"            # matches 1.0.0
      - "[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+" # matches 1.0.0-dev.1

jobs:

  # ── Job 1: build & test ────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    # Only read access needed here.
    # No id-token, no attestations, no release creation.
    permissions:
      contents: read

    # Expose is_prerelease so the release job can consume it
    outputs:
      is_prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      # Detect if tag is a dev pre-release
      - name: Check if pre-release
        id: prerelease_check
        run: |
          if [[ "${{ github.ref_name }}" == *"-dev"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Upload artifacts so the release job can access them
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: plugin-dist
          path: |
            main.js
            styles.css
            manifest.json

  # ── Job 2: attest & release ────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: build  # Only runs if build job succeeds

    permissions:
      contents: write      # required to create the GitHub release
      id-token: write      # required to mint OIDC token for attestation signing
      attestations: write  # required to store attestations

    steps:
      # Download the artifacts produced by the build job
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: plugin-dist

      - name: Attest main.js
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: styles.css

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: |
            main.js
            styles.css
            manifest.json
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease }}  # Read from build job output
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}